[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kikuyu-tts"
version = "0.1.0"
description = "English-to-Kikuyu translation and speech synthesis pipeline on Apple Silicon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mlx-audio",
  "transformers>=4.48.0",
  "torch>=2.6.0",
  "accelerate>=0.34.0",
  "datasets[audio]>=3.0.0",
  "evaluate>=0.4.3",
  "huggingface_hub>=0.24.0",
  "jiwer>=3.0.5",
  "sentencepiece>=0.2.0",
  "safetensors>=0.4.5",
  "numpy>=1.26.0",
  "pyyaml>=6.0",
  "soundfile>=0.13.1",
  "Cython>=3.0.0",
  "Unidecode>=1.3.0",
  "librosa>=0.10.1",
  "matplotlib>=3.8.0",
  "scipy>=1.11.0",
  "mlflow>=2.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
