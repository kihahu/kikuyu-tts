model:
  name: facebook/mms-1b-all
  # ISO 639-3 code in mms-1b-all vocab (there is no "ki" key)
  target_lang: kik

dataset:
  # Public Waxal Kikuyu TTS split exposes paired audio + text usable for ASR fine-tuning.
  name: google/WaxalNLP
  config: kik_tts
  text_column: text
  train_splits:
    - train
    - validation
  eval_split: test
  min_audio_seconds: 0.5
  max_audio_seconds: 30.0

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  warmup_steps: 100
  max_steps: 1500
  eval_strategy: steps
  save_strategy: steps
  eval_steps: 100
  save_steps: 100
  logging_steps: 25
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false
  gradient_checkpointing: true
  # HF Jobs runs are simpler without external tracking infra.
  report_to: none
  # MLflow run title (optional). If null and report_to includes mlflow, the script picks a timestamped name.
  run_name: null

runtime:
  num_proc: 1

outputs:
  output_dir: artifacts/mms_asr_kik
  # Sync checkpoint to the Hub (Trainer calls create_repo(..., exist_ok=True) on startup when push_to_hub is true).
  push_to_hub: true
  # Use a new model ID so baseline checkpoint remains intact.
  hub_model_id: kihahu/mms-asr-kik-finetuned-multisource
  hub_private_repo: true
  # Use Hub PR uploads when the token cannot commit directly to the protected model repo.
  hub_create_pr: true
  # "end" = one upload after training (recommended). See TrainingArguments hub_strategy.
  hub_strategy: end
  # Extra safeguards: fail fast before training, upload each saved checkpoint, and verify final Hub load.
  hub_verify_after_push: true
  hub_upload_checkpoints: true
  hub_upload_every_n_saves: 1
  hub_required_files:
    - config.json
    - model.safetensors
    - tokenizer_config.json
    - preprocessor_config.json
    - vocab.json
    - trainer_state.json
    - eval_results.json
    - dataset_summary.json
