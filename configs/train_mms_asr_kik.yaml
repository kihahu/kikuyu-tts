model:
  name: facebook/mms-1b-all
  # ISO 639-3 code in mms-1b-all vocab (there is no "ki" key)
  target_lang: kik

dataset:
  name: google/WaxalNLP
  config: kik_tts
  text_column: text
  train_splits:
    - train
    - validation
  eval_split: test
  min_audio_seconds: 0.5
  max_audio_seconds: 30.0

training:
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 3.0e-5
  warmup_steps: 100
  max_steps: 1500
  eval_strategy: steps
  save_strategy: steps
  eval_steps: 100
  save_steps: 100
  logging_steps: 25
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false
  gradient_checkpointing: true
  # Hugging Face Trainer integrations: "mlflow", "none", "wandb", or a list.
  report_to: mlflow
  # MLflow run title (optional). If null and report_to includes mlflow, the script picks a timestamped name.
  run_name: null

runtime:
  num_proc: 1

outputs:
  output_dir: artifacts/mms_asr_kik
  # HF Jobs do not expose the container disk as "download output". Set push_to_hub true and a hub_model_id
  # (with HF_TOKEN, e.g. --secrets HF_TOKEN) so the finished checkpoint appears on the Hub.
  push_to_hub: false
  hub_model_id: null
  # "end" = one upload after training (recommended). See TrainingArguments hub_strategy.
  hub_strategy: end
