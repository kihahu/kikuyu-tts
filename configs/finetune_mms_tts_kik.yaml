experiment:
  name: mms_tts_kik_waxal_workflow
  seed: 42

data:
  prepared_root: data/waxal_kik_tts
  train_manifest: data/waxal_kik_tts/manifests/train_single_speaker.jsonl
  dev_manifest: data/waxal_kik_tts/manifests/dev_single_speaker.jsonl
  test_manifest: data/waxal_kik_tts/manifests/test_single_speaker.jsonl
  sample_rate: 16000
  language: kikuyu

model:
  base_model: facebook/mms-tts-kik
  tokenizer_model: facebook/mms-tts-kik
  base_model_candidates:
    - facebook/mms-tts-kik
    - facebook/mms-tts-swh
    - facebook/mms-tts-kin
    - facebook/mms-tts-lug

training:
  selection_strategy: primary_only
  target_voice_mode: single_speaker_average
  learning_rate: 0.00005
  early_stopping_patience: 3
  freeze_strategy: none

evaluation:
  fixed_prompt_file: data/eval/kikuyu_prompts.txt
  metrics:
    - synthesis_success_rate
    - clipping_rate
    - subjective_intelligibility

outputs:
  export_hf_dir: artifacts/mms_tts_selected_base
  eval_report_csv: artifacts/mms_tts_candidate_report.csv
  selection_report_json: artifacts/mms_tts_selection_report.json
